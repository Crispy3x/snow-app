name: CI
on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core logic tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  routing-server:
    name: Routing server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: server

  apple:
    name: Build the screens (macOS and iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # This is the first place the SwiftUI screens are really compiled. Read any errors in the log.
      - name: Build for macOS
        run: swift build
      - name: Test on macOS
        run: swift test
      - name: Build for iOS (compiles the camera and other iPhone-only code)
        run: xcodebuild -scheme RidgelineUI -destination 'generic/platform=iOS Simulator' build

  app-project:
    name: Build the app project (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Make the Xcode project and build it without signing
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild build \
            -project RidgelineOps.xcodeproj \
            -scheme RidgelineOps \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      # Pictures of every main screen with sample data, so the look can be checked without a phone.
      - name: Take a picture of each screen in the simulator
        continue-on-error: true
        run: |
          APP="$PWD/build/Build/Products/Debug-iphonesimulator/RidgelineOps.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; print(c[-1]['udid'])")
          echo "Simulator $UDID, app $BID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BID" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          mkdir -p shots
          shoot() {  # name, extra launch arguments
            name="$1"; shift
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -uiShot "$name" "$@" >/dev/null
            sleep 3
            xcrun simctl io "$UDID" screenshot "shots/raw.png" >/dev/null 2>&1
            sips -s format jpeg -s formatOptions 72 -Z 1500 shots/raw.png --out "shots/$name${SUFFIX}.jpg" >/dev/null
          }
          SUFFIX=""
          for s in welcome onboarding tutorial home calendar jobs clients requests menu fieldWork business profit settings profile subscription paywall \
                   quotes storm visits timeClock proof team revenue assistant route notifications clientDetail invoices invoiceDetail quickInvoice jobEditor jobDetail stormStart addMember; do
            shoot "$s"
          done
          # Long pages again, half-way down and at the bottom.
          SUFFIX="-mid"
          for s in home settings clientDetail profit jobDetail storm visits; do shoot "$s" -uiAnchor 0.5; done
          SUFFIX="-end"
          for s in home settings clientDetail profit jobDetail storm visits; do shoot "$s" -uiAnchor 1; done
          SUFFIX="-light"
          for s in home clientDetail jobs; do shoot "$s" -uiLight YES; done
          rm -f shots/raw.png
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
